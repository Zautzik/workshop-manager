name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (production)
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ci-build-secret-not-for-runtime
          NEXT_PUBLIC_DEV_BYPASS: "false"
        run: npm run build

      - name: Guard production bundle against dev bypass
        run: |
          if grep -R "DevBypassProvider" .next/standalone 2>/dev/null; then
            echo "FATAL: DevBypassProvider found in production standalone bundle"
            exit 1
          fi

      - name: Verify CSP wiring
        run: npm run verify:csp
