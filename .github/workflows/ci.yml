name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 quedó sin soporte el 2026-04-30 y supabase-js declara >=22.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check for duplicate migration definitions
        run: npm run check:migrations

      - name: Check for dead function references
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:functions

      - name: Test
        run: npm run test

      - name: Build (production)
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ci-build-secret-not-for-runtime
          NEXT_PUBLIC_DEV_BYPASS: "false"
        run: npm run build

      - name: Guard production bundle against dev bypass
        run: |
          if grep -R "DevBypassProvider" .next/standalone 2>/dev/null; then
            echo "FATAL: DevBypassProvider found in production standalone bundle"
            exit 1
          fi

      - name: Verify CSP wiring
        run: npm run verify:csp

      # Cobertura de auth y de rol: un escaneo de src/app/api, sin red y sin
      # base de datos. Es el subconjunto de smoke.mjs que CI puede correr, y
      # atrapa la regresión que de verdad pasó -- una ruta nueva sin control
      # de rol. El barrido de lectura y el golden thread siguen siendo locales.
      - name: Auth and role coverage (static)
        run: npm run test:smoke:static
