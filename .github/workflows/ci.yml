name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    env:
      # `secrets` no se puede leer en un `if:` de paso; un env del job sí.
      HAS_SUPABASE_SECRETS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 quedó sin soporte el 2026-04-30 y supabase-js declara >=22.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check for duplicate migration definitions
        run: npm run check:migrations

      # Lee el catálogo de la base remota, así que necesita los dos secretos del
      # repositorio. Un PR de Dependabot o de un fork NUNCA los recibe: fallar ahí
      # bloqueaba el merge sin que el código tuviera nada que ver (job
      # 126136143894, 2026-11-04). Sin secretos se omite con un aviso visible en
      # cada corrida; con secretos corre y falla como siempre si encuentra deriva.
      - name: Check for dead function references
        if: ${{ env.HAS_SUPABASE_SECRETS == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:functions

      - name: Dead function references (omitido)
        if: ${{ env.HAS_SUPABASE_SECRETS != 'true' }}
        run: |
          echo "::warning title=check:functions omitido::Faltan los secretos NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY (Settings → Secrets and variables → Actions). Normal en PRs de Dependabot o forks; si pasa en un PR propio, los secretos no están configurados. Córrelo local: npm run check:functions"

      - name: Test
        run: npm run test

      - name: Build (production)
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ci-build-secret-not-for-runtime
          NEXT_PUBLIC_DEV_BYPASS: "false"
        run: npm run build

      - name: Guard production bundle against dev bypass
        run: |
          if grep -R "DevBypassProvider" .next/standalone 2>/dev/null; then
            echo "FATAL: DevBypassProvider found in production standalone bundle"
            exit 1
          fi

      - name: Verify CSP wiring
        run: npm run verify:csp

      # Cobertura de auth y de rol: un escaneo de src/app/api, sin red y sin
      # base de datos. Es el subconjunto de smoke.mjs que CI puede correr, y
      # atrapa la regresión que de verdad pasó -- una ruta nueva sin control
      # de rol. El barrido de lectura y el golden thread siguen siendo locales.
      - name: Auth and role coverage (static)
        run: npm run test:smoke:static
